hero:
  badge: "Disponibile per nuove collaborazioni"
  headline: "Fisico · Cloud & ML Engineer"
  tagline: >-
    La curiosità apre strade. Il metodo aiuta a percorrerle.
    Progetto infrastrutture cloud e sistemi di machine learning,
    con la creatività di chi esplora e il rigore di chi verifica.
  cta_primary: "Contattami"
  cta_secondary: "Vedi il CV"

profilo:
  eyebrow: "01 — Profilo"
  title: "Immaginare, costruire, mettere alla prova"
  paragraphs:
    - >-
      Sono un fisico di formazione e lavoro tra <strong>infrastrutture cloud,
      software e machine learning</strong>. La creatività è parte del mio metodo:
      cercare collegamenti, cambiare prospettiva e immaginare soluzioni.
      Poi costruisco, misuro e metto alla prova le idee.
    - >-
      Gestisco piattaforme cloud con <strong>Kubernetes</strong>, costruisco pipeline
      di dati e sviluppo sistemi di rilevamento delle anomalie. Mi occupo anche di
      valutazione di agenti basati su LLM e red teaming: ne metto alla prova il
      comportamento per individuare limiti e vulnerabilità.
    - >-
      Cerco soluzioni che si possano capire, osservare e migliorare nel tempo:
      poche dipendenze, costi sotto controllo e documentazione chiara.
      Anche questo sito segue la stessa idea: essenziale, statico, senza cookie
      e senza strumenti di tracciamento.

