hero:
  badge: "Open to new collaborations"
  headline: "Physicist · Cloud & ML Engineer"
  tagline: >-
    Curiosity sparks ideas. A scientific approach puts them to the test.
    I design cloud infrastructure and machine learning systems,
    combining creative thinking with careful experimentation.
  cta_primary: "Get in touch"
  cta_secondary: "View CV"

profilo:
  eyebrow: "01 — Profile"
  title: "Imagine. Build. Test."
  paragraphs:
    - >-
      I'm a physicist by training, working across <strong>cloud infrastructure,
      software and machine learning</strong>. Creativity is part of how I work:
      making connections, changing perspective and exploring possible solutions.
      Then I build, measure and put those ideas to the test.
    - >-
      I manage cloud platforms with <strong>Kubernetes</strong>, build data
      pipelines and develop anomaly detection systems. I also evaluate LLM-based
      agents and carry out red teaming, testing their behaviour to uncover
      limitations and vulnerabilities.
    - >-
      I aim for systems that are easy to understand, monitor and improve over
      time: few dependencies, costs under control and clear documentation.
      This site follows the same thinking: a simple, static site with no cookies
      or tracking tools.

